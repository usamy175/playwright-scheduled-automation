[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-scheduled-automation"
version = "0.1.0"
description = "Safe local demo of scheduled web automation with Python and Playwright."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.46,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0"
]

[project.scripts]
playwright-scheduled-automation = "playwright_scheduled_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
